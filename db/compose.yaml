# Optional portable host setup. The native test here used PostgreSQL 14.24;
# this PostgreSQL 17 container configuration still needs Docker-host verification.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lemmi
      POSTGRES_USER: lemmi
      POSTGRES_PASSWORD: ${LEMMI_POSTGRES_PASSWORD:?Set a private database password}
    ports:
      - "127.0.0.1:${LEMMI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - lemmi-postgres:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
      - -c
      - log_duration=off
      - -c
      - log_min_duration_statement=-1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmi -d lemmi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lemmi-postgres:
